Categories:
  - Sports & Health
License: GPL-3.0-or-later
AuthorName: merlinlcb
SourceCode: https://github.com/merlinlcb/FossFitness
IssueTracker: https://github.com/merlinlcb/FossFitness/issues
Changelog: https://github.com/merlinlcb/FossFitness/releases

AutoName: FossFitness

RepoType: git
Repo: https://github.com/merlinlcb/FossFitness.git

Builds:
  - versionName: 2.1.0
    versionCode: 2100
    commit: 354b06296807403af6fd41c14c9d883f7e957f49
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y curl
      - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      - apt-get install -y nodejs
    init: npm ci
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - export FF_DISTRIBUTION=fdroid
      - find node_modules -type d -name local-maven-repo -prune -exec rm -r {} +
      - npx expo prebuild --platform android --no-install --clean
    scanignore:
      - app/node_modules
    build:
      - export FF_DISTRIBUTION=fdroid
      - cd android
      - ./gradlew assembleRelease --no-daemon
    ndk: r27b

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: 
  app/version.json|"versionCode":\s*(\d+)|app/version.json|"versionName":\s*"([^"]+)"
CurrentVersion: 2.1.0
CurrentVersionCode: 2100
